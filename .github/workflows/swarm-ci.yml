name: SWARM CI

on:
  workflow_call:
  push:
    branches:
      - "**"
  pull_request:
  repository_dispatch:
    types: [swarm-ci-trigger]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: swarm-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  swarm-enforcement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SWARM audit (deterministic checks)
        shell: bash
        run: |
          set -euo pipefail

          run_if_present() {
            local marker="$1"
            local command="$2"
            if [[ -e "$marker" ]]; then
              echo "Running: $command"
              bash -lc "$command"
            else
              echo "Skipping: $command (missing $marker)"
            fi
          }

          run_if_present "package.json" "npm ci --ignore-scripts && npm run lint --if-present && npm run build --if-present && npm test --if-present"
          run_if_present "requirements.txt" "python -m pip install -r requirements.txt && python -m pytest -q"
          run_if_present "pyproject.toml" "python -m pip install . && python -m pytest -q"
          run_if_present "go.mod" "go test ./..."
          run_if_present "Cargo.toml" "cargo test --locked"
          run_if_present "pom.xml" "mvn -B -ntp test"
          run_if_present "build.gradle" "./gradlew test"

      - name: Protected artifacts guard
        shell: bash
        run: |
          set -euo pipefail
          git update-index -q --refresh
          if ! git diff --quiet -- architecture.md specs docs prompts governance; then
            echo "Protected artifacts changed during CI."
            git --no-pager diff -- architecture.md specs docs prompts governance || true
            exit 1
          fi

      - name: Termination phrase
        run: echo "Mode complete. Awaiting operator approval."
